<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CollectHub</title>
  <desc id="desc">把小红书和 X 的链接保存为本地可阅读、可搜索、可迁移的知识库。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <path d="M0 334 C228 286 408 404 630 354 C854 304 1021 343 1200 274 L1200 420 L0 420 Z" fill="#0d1b2d"/>

  <g id="title-block" transform="translate(64 54)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="0" fill="#8da2bd" font-size="15" font-weight="700" letter-spacing="2.4">LOCAL-FIRST AGENT SKILL · macOS</text>
    <text x="0" y="80" fill="#f8fafc" font-size="72" font-weight="760" letter-spacing="-2">CollectHub</text>
    <rect x="0" y="104" width="54" height="5" rx="2.5" fill="#ffd166"/>
    <text x="0" y="154" fill="#e5edf7" font-size="28" font-weight="650">把平台收藏，变成真正属于你的内容。</text>
    <text x="0" y="196" fill="#9fb0c5" font-size="18">发一个链接，保存正文、图片和视频。</text>
    <text x="0" y="226" fill="#9fb0c5" font-size="18">本地可读、可搜索、可迁移。</text>

    <g transform="translate(0 270)" font-size="14" font-weight="650">
      <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#34455d"/>
      <text x="45" y="22" fill="#e2e8f0" text-anchor="middle">小红书</text>
      <rect x="102" width="56" height="34" rx="17" fill="#1e293b" stroke="#34455d"/>
      <text x="130" y="22" fill="#e2e8f0" text-anchor="middle">X</text>
      <rect x="170" width="76" height="34" rx="17" fill="#1e293b" stroke="#34455d"/>
      <text x="208" y="22" fill="#e2e8f0" text-anchor="middle">Codex</text>
      <rect x="258" width="88" height="34" rx="17" fill="#1e293b" stroke="#34455d"/>
      <text x="302" y="22" fill="#e2e8f0" text-anchor="middle">Hermes</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(680 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(0 30) rotate(-4 105 50)">
      <rect width="218" height="94" rx="16" fill="#fff7f5"/>
      <circle cx="31" cy="31" r="14" fill="#ff2442"/>
      <text x="31" y="36" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">小</text>
      <rect x="57" y="20" width="116" height="10" rx="5" fill="#d7c7c7"/>
      <rect x="57" y="40" width="136" height="8" rx="4" fill="#eadede"/>
      <rect x="18" y="65" width="54" height="12" rx="6" fill="#ffd8de"/>
      <rect x="82" y="65" width="54" height="12" rx="6" fill="#f0e8e8"/>
    </g>

    <g transform="translate(260 4) rotate(4 105 50)">
      <rect width="214" height="94" rx="16" fill="#f8fafc"/>
      <circle cx="31" cy="31" r="14" fill="#050505"/>
      <text x="31" y="36" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">X</text>
      <rect x="57" y="20" width="100" height="10" rx="5" fill="#b7c0cc"/>
      <rect x="57" y="40" width="132" height="8" rx="4" fill="#d8dee6"/>
      <rect x="18" y="65" width="156" height="8" rx="4" fill="#e7ebf0"/>
    </g>

    <path d="M114 139 C154 168 184 174 232 190" fill="none" stroke="#5f738d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M366 119 C338 154 313 170 272 190" fill="none" stroke="#5f738d" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="248" cy="193" r="5" fill="#ffd166"/>

    <g transform="translate(72 174)">
      <path d="M36 0 H153 L174 24 H362 Q378 24 378 40 V170 Q378 186 362 186 H16 Q0 186 0 170 V40 Q0 24 16 24 H36 Z" fill="url(#folder)"/>
      <rect x="24" y="55" width="330" height="108" rx="13" fill="#fffaf0"/>
      <text x="44" y="84" fill="#7a5200" font-size="13" font-weight="750" letter-spacing="1.2">~/COLLECTHUB</text>
      <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
        <text x="45" y="113" fill="#243447">index.md</text>
        <text x="45" y="137" fill="#52657a">metadata.json</text>
        <text x="207" y="113" fill="#243447">assets/</text>
        <text x="207" y="137" fill="#52657a">images · video</text>
      </g>
    </g>
  </g>
</svg>
