<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">从平台收藏到本地资料库</title>
  <desc id="desc">以前内容散落在平台里，难找且可能失效；使用 CollectHub 后，内容在本地统一归档，可以阅读、搜索、备份和迁移。</desc>
  <rect width="1200" height="360" rx="26" fill="#f6f3ec"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(58 52)">
      <text x="0" y="0" fill="#9a7b72" font-size="14" font-weight="750" letter-spacing="2">BEFORE</text>
      <text x="0" y="42" fill="#2f2927" font-size="28" font-weight="720">收藏留在平台里</text>

      <g transform="translate(0 74)">
        <rect width="390" height="170" rx="18" fill="#ffffff" stroke="#e4dcd7"/>
        <g transform="translate(24 24)">
          <circle cx="18" cy="18" r="18" fill="#ff2442"/>
          <text x="18" y="24" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">小</text>
          <rect x="51" y="4" width="146" height="11" rx="5.5" fill="#d7d0cd"/>
          <rect x="51" y="27" width="210" height="8" rx="4" fill="#ece7e4"/>
        </g>
        <line x1="24" y1="82" x2="366" y2="82" stroke="#eee8e4"/>
        <g transform="translate(24 103)">
          <circle cx="18" cy="18" r="18" fill="#111111"/>
          <text x="18" y="24" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">X</text>
          <rect x="51" y="4" width="116" height="11" rx="5.5" fill="#d7d0cd"/>
          <rect x="51" y="27" width="245" height="8" rx="4" fill="#ece7e4"/>
        </g>
      </g>

      <g transform="translate(0 274)" fill="#735f59" font-size="15">
        <text x="0" y="0">散落 · 难找 · 可能失效 · 难以迁移</text>
      </g>
    </g>

    <g transform="translate(520 162)">
      <circle cx="34" cy="18" r="34" fill="#15263b"/>
      <path d="M20 18 H47 M38 9 L47 18 L38 27" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(650 52)">
      <text x="0" y="0" fill="#527258" font-size="14" font-weight="750" letter-spacing="2">WITH COLLECTHUB</text>
      <text x="0" y="42" fill="#1e3524" font-size="28" font-weight="720">内容真正保存在本地</text>

      <g transform="translate(0 74)">
        <rect width="492" height="170" rx="18" fill="#153523"/>
        <text x="26" y="32" fill="#a9d6b1" font-size="12" font-weight="700" letter-spacing="1.3">~/COLLECTHUB/2026/07</text>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
          <text x="27" y="66" fill="#f3f7f3">xiaohongshu/</text>
          <text x="52" y="92" fill="#d8e8dc">一篇值得收藏的内容/</text>
          <text x="78" y="118" fill="#ffd166">index.md</text>
          <text x="194" y="118" fill="#b9cfbe">metadata.json</text>
          <text x="346" y="118" fill="#b9cfbe">assets/</text>
          <text x="27" y="148" fill="#f3f7f3">x/</text>
        </g>
      </g>

      <g transform="translate(0 274)" fill="#3f6547" font-size="15" font-weight="650">
        <text x="0" y="0">可阅读 · 可搜索 · 可备份 · 可迁移</text>
      </g>
    </g>
  </g>
</svg>
