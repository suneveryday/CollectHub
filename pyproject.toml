[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-ingestor"
version = "1.0.0"
description = "Local-first CollectHub ingestor with deterministic Xiaohongshu and X routing"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
content-ingestor = "content_ingestor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
